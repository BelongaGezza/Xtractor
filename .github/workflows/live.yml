name: Live (latest yt-dlp)
# Weekly canary: run the opt-in live tests against the newest yt-dlp so extractor breakage
# is noticed before users hit it. Opens one issue on failure (not a new one every week).
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    # Self-hosted: GitHub-hosted runner IPs are bot-checked by YouTube, so every live test skips.
    # Start the runner by hand: cd ~/actions-runner && ./run.sh (ephemeral, one job, re-run config.sh with a new token each time).
    runs-on: [self-hosted, macOS, ARM64, xtractor-live]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install --upgrade "yt-dlp[default]"
      - name: Show versions
        run: python -m pip list 2>/dev/null | grep -i -E "yt-dlp|xtractor"
      - name: Live tests
        env:
          XTRACTOR_LIVE: "1"
        run: pytest -m live tests/live -ra --junitxml=live-results.xml
      - name: Fail if no live test actually ran
        # A bot-check skip is green in pytest, so a skip-only run would hide breakage.
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("live-results.xml").getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          total = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          ran = total - skipped
          print(f"live tests: {total} collected, {skipped} skipped, {ran} ran")
          if ran == 0:
              raise SystemExit("No live test ran (all skipped, likely a YouTube bot check); the canary tested nothing.")
          PY
      - name: Open an issue if not already present
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Weekly live test failed with latest yt-dlp"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Still failing: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "The scheduled live run failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Likely a YouTube or yt-dlp change. Bump the yt-dlp pin, rebuild, re-run the live suite and cut a patch release."
          fi
