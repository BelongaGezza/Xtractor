name: Live (latest yt-dlp)
# Weekly canary: run the opt-in live tests against the newest yt-dlp so extractor breakage
# is noticed before users hit it. Opens one issue on failure (not a new one every week).
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: brew install ffmpeg deno
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install --upgrade "yt-dlp[default]"
      - name: Show versions
        run: python -m pip list 2>/dev/null | grep -i -E "yt-dlp|xtractor"
      - name: Live tests
        env:
          XTRACTOR_LIVE: "1"
        run: pytest -m live tests/live -ra
      - name: Open an issue if not already present
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Weekly live test failed with latest yt-dlp"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Still failing: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "The scheduled live run failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Likely a YouTube or yt-dlp change. Bump the yt-dlp pin, rebuild, re-run the live suite and cut a patch release."
          fi
