name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict src
      - name: Tests with coverage gate on non-I/O modules
        run: >
          pytest --cov=xtractor --cov-report=term-missing
          --cov-config=pyproject.toml
          && coverage report --fail-under=85
          --include="*/xtractor/errors.py,*/xtractor/options.py,*/xtractor/urls.py,*/xtractor/formats.py,*/xtractor/paths.py,*/xtractor/cli.py"
