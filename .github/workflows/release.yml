name: Release
# Tag v* builds the arm64 binary and publishes a GitHub release.
# Pull requests touching packaging build the same artifacts as a dry run (nothing is published).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "scripts/**"
      - "packaging/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Quality gates
        run: |
          ruff check .
          mypy --strict src
          pytest
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="$(python -c 'import xtractor; print(xtractor.__version__)')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "tag $tag does not match xtractor.__version__ $pkg" >&2
            exit 1
          fi
      # Contract of scripts/build_binary.sh: writes dist/Xtractor,
      # dist/Xtractor-<version>-macos-arm64.tar.gz and dist/SHA256SUMS.
      - name: Build binary
        run: ./scripts/build_binary.sh
      - name: Smoke test
        run: |
          ./dist/Xtractor --version
          ./dist/Xtractor -h > /dev/null
          (cd dist && shasum -a 256 -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/Xtractor-*-macos-arm64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          # Tags like v1.0.0-rc.1 are pre-releases; --self-update only follows "latest".
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" --title "Xtractor ${GITHUB_REF_NAME#v}" \
            --generate-notes $flags

  tap:
    # Optional: bump the Homebrew tap (needs a TAP_REPO variable "owner/homebrew-xtractor"
    # and a TAP_TOKEN secret with write access to it). Skipped for pre-releases.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && vars.TAP_REPO != ''
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.TAP_REPO }}
          token: ${{ secrets.TAP_TOKEN }}
          path: tap
      - name: Update formula
        run: |
          ./packaging/homebrew/update_formula.sh "${GITHUB_REF_NAME#v}" \
            "assets/Xtractor-${GITHUB_REF_NAME#v}-macos-arm64.tar.gz" \
            "tap/Formula/xtractor.rb" "$GITHUB_REPOSITORY"
          cd tap
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -am "xtractor ${GITHUB_REF_NAME#v}"
          git push
