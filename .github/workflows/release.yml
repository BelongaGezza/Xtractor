name: Release
# Tag vX.Y.Z[-rc.N] builds the arm64 binary, signs the checksums and publishes a GitHub release.
# Pull requests touching packaging build the same artifacts as a dry run (nothing is signed or
# published).
#
# One-time setup by the repository owner (see docs/BUILD_NOTES.md section 8):
#   * environment "release" with required reviewers, holding the secret XTRACTOR_SIGNING_KEY
#   * a tag protection ruleset for v*
#   * optional: variable TAP_REPO and secret TAP_TOKEN (environment "release") for Homebrew
on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  pull_request:
    paths:
      - "scripts/**"
      - "packaging/**"
      - "requirements-build.*"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH[-alpha|beta|rc.N]" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tagged commit is not on main; refusing to release" >&2
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install hash-locked build dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-build.txt
          python -m pip install --no-deps -e .
      - name: Quality gates
        run: |
          ruff check .
          ruff format --check .
          mypy --strict src
          pytest
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="$(python -c 'import xtractor; print(xtractor.__version__)')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "tag $tag does not match xtractor.__version__ $pkg" >&2
            exit 1
          fi
      - name: Build tools prerequisites
        run: brew install pkgconf
      # Contract of scripts/build_binary.sh: writes dist/Xtractor,
      # dist/Xtractor-<version>-macos-arm64.tar.gz, dist/SHA256SUMS and dist/BUILDINFO-*.json.
      - name: Build binary
        env:
          PYTHON: python
        run: ./scripts/build_binary.sh
      - name: Smoke test (offline)
        run: |
          want="Xtractor $(python -c 'import xtractor; print(xtractor.__version__)')"
          [ "$(./dist/Xtractor --version | head -1)" = "$want" ]
          ./dist/Xtractor -h > /dev/null
          (cd dist && shasum -a 256 -c SHA256SUMS)
          # Extracts the embedded tools to a scratch cache, round-trips audio through the
          # embedded ffmpeg, runs the embedded JS runtime. No network, scrubbed PATH.
          env -i HOME="$HOME" PATH=/usr/bin:/bin TMPDIR="${RUNNER_TEMP}" \
            XTRACTOR_SELFTEST=1 XTRACTOR_ALLOW_OVERRIDES=1 \
            XTRACTOR_CACHE_DIR="${RUNNER_TEMP}/xtractor-selftest-cache" \
            ./dist/Xtractor --xtractor-selftest
      - name: Collect licence-compliance records
        run: cp scripts/build_ffmpeg.sh scripts/common.sh dist/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-assets
          path: |
            dist/Xtractor-*-macos-arm64.tar.gz
            dist/SHA256SUMS
            dist/BUILDINFO-*.json
            dist/build_ffmpeg.sh
            dist/common.sh
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # Protected environment: required reviewers; holds XTRACTOR_SIGNING_KEY.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-assets
          path: assets
      - name: Sign SHA256SUMS (Ed25519)
        env:
          XTRACTOR_SIGNING_KEY: ${{ secrets.XTRACTOR_SIGNING_KEY }}
        run: |
          if [ -z "$XTRACTOR_SIGNING_KEY" ]; then
            echo "secret XTRACTOR_SIGNING_KEY is missing from the 'release' environment;" \
              "a tag release must be signed (--self-update refuses unsigned releases)" >&2
            exit 1
          fi
          (cd assets && shasum -a 256 -c SHA256SUMS)
          python3 scripts/sign_release.py assets/SHA256SUMS assets/SHA256SUMS.sig
      - name: Build provenance attestation
        # Artifact attestations need a public repository (or GitHub Enterprise Cloud).
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: assets/Xtractor-*-macos-arm64.tar.gz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          # Tags like v1.0.0-rc.1 are pre-releases; --self-update only follows "latest".
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" --title "Xtractor ${GITHUB_REF_NAME#v}" \
            --generate-notes $flags

  tap:
    # Optional: bump the Homebrew tap (needs a TAP_REPO variable "owner/homebrew-xtractor"
    # and a TAP_TOKEN secret with contents:write on that repository only). Skipped for pre-releases.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && vars.TAP_REPO != ''
    needs: publish
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-assets
          path: assets
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.TAP_REPO }}
          token: ${{ secrets.TAP_TOKEN }}
          path: tap
      - name: Update formula
        run: |
          ./packaging/homebrew/update_formula.sh "${GITHUB_REF_NAME#v}" \
            "assets/Xtractor-${GITHUB_REF_NAME#v}-macos-arm64.tar.gz" \
            "tap/Formula/xtractor.rb" "$GITHUB_REPOSITORY"
          cd tap
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -am "xtractor ${GITHUB_REF_NAME#v}"
          git push
